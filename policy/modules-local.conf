#
# This file controls standalone local override modules.
# Only modules from policy/modules/local are considered here.
#
# Local modules are compiled and loaded separately from the base policy:
#   make local-modules
#   make install-local
#   make load-local
#
# Valid states:
#   module - build/install/load this local override module
#   off    - ignore this local module
#
# Local modules should be named local_<something>.
#

local_test = module
